name: PR preview

# Deploys a live preview of every PR to
# https://pablo-mayrgundter.github.io/slop-newyork/pr-preview/pr-<N>/
# Cleaned up automatically on PR close. Lands on the gh-pages branch under
# pr-preview/pr-<N>/, sibling to the main deploy at the root (pages.yml),
# and stages the same files (.github/actions/build).
#
# PRs from forks are skipped: their GITHUB_TOKEN is read-only, so they can't
# push to gh-pages or comment.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
